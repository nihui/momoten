name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete CI runs for earlier commits on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-native-diagnostics:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Compare native OpenCL kernel compilation and dispatch
        run: |
          clang++ tests/runtime/apple_barrier_probe.cpp -framework OpenCL -o probe
          ./probe

  linux:
    name: linux-${{ matrix.name }}-manylinux2014
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Reuse the exact manylinux2014 image digests from the last passing
          # cibuildwheel run; glibc stays at 2.17 when newer images are published.
          - name: x86_64
            image: quay.io/pypa/manylinux2014_x86_64@sha256:f6a6f153c9cf45470507ebbc27013e5db14ce21331b62fd2c540561f25e5f0a5
            platform: linux/amd64
            elf_class: 64
          - name: x86
            image: quay.io/pypa/manylinux2014_i686@sha256:30305867f278896ee117b0d162a8e4f9b7b16819e6590f6139e14c5ed5b23fdd
            platform: linux/386
            elf_class: 32
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # momoten distributes a C++ shared library, not a Python wheel.
      - name: Build directly in manylinux2014
        shell: bash
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project \
            "${{ matrix.image }}" \
            bash -ec '
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_LIBDIR=lib \
                "-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++ -static-libgcc" \
                -DMOMOTEN_BUILD_DRIVER=ON \
                -DMOMOTEN_BUILD_TRANSLATOR=ON \
                -DMOMOTEN_BUILD_TOOLS=OFF \
                -DMOMOTEN_BUILD_TESTS=OFF \
                -DMOMOTEN_INSTALL=ON
              cmake --build build --target momoten_driver --parallel 4
              cmake --install build --strip --prefix /project/stage
            '

      - name: Verify Linux ABI and exported symbols
        shell: bash
        run: |
          test -f stage/lib/libmomoten.so
          test ! -L stage/lib/libmomoten.so
          test "$(find stage/lib -maxdepth 1 -name 'libmomoten.so*' | wc -l)" -eq 1
          test "$(find stage -type f | wc -l)" -eq 2
          test -f stage/lib/momoten_icd.json
          grep -q '"api_version": "1.1.0"' stage/lib/momoten_icd.json
          readelf -h stage/lib/libmomoten.so | grep -q "Class:.*ELF${{ matrix.elf_class }}"
          nm -D --defined-only stage/lib/libmomoten.so | grep -E ' vkGetInstanceProcAddr$'
          readelf -d stage/lib/libmomoten.so > dynamic.txt
          if grep -Ei 'NEEDED.*(libOpenCL|libstdc\+\+|libgcc_s)' dynamic.txt; then
            echo 'Unexpected dynamic loader/C++ runtime dependency' >&2
            exit 1
          fi
          readelf --version-info stage/lib/libmomoten.so > version-info.txt
          python3 - <<'PY'
          import re
          from pathlib import Path

          versions = Path("version-info.txt").read_text()
          glibc = sorted({(int(major), int(minor)) for major, minor
                          in re.findall(r"\bGLIBC_(\d+)\.(\d+)\b", versions)})
          if not glibc:
              raise SystemExit("No GLIBC version requirements found")
          maximum = glibc[-1]
          print("Maximum required glibc:", ".".join(map(str, maximum)))
          if maximum > (2, 17):
              raise SystemExit("glibc requirement exceeds manylinux2014 (2.17)")
          for family in ("GLIBCXX", "CXXABI"):
              required = sorted({tuple(map(int, version.split(".")))
                                 for version in re.findall(r"\b" + family + r"_(\d+(?:\.\d+)+)\b", versions)})
              print(family + " requirements:", required[-1] if required else "none")
          PY
          if readelf -SW stage/lib/libmomoten.so | grep -E '\.debug_'; then
            echo 'Unexpected debug sections in Linux release library' >&2
            exit 1
          fi
          stat -Lc 'libmomoten.so size: %s bytes' stage/lib/libmomoten.so

      - name: Smoke test system Vulkan Loader and proc registry
        if: matrix.name == 'x86_64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 pocl-opencl-icd
          ldconfig -p | grep -Ei '(pocl|OpenCL)' || true
          MOMOTEN_DEBUG=1 MOMOTEN_OPENCL_DRIVER=libOpenCL.so.1 python3 tests/runtime/vulkan_loader_smoke.py \
            stage/lib/libmomoten.so stage/lib/momoten_icd.json
          g++ -std=c++11 tests/api/proc_registry_test.cpp \
            -I third_party/vulkan-headers/include -L stage/lib \
            -Wl,-rpath,"$PWD/stage/lib" -lmomoten -ldl -o build/proc_registry_test
          MOMOTEN_OPENCL_DRIVER=libOpenCL.so.1 build/proc_registry_test \
            "$PWD/stage/lib/libmomoten.so"

      - name: Bundle license notices
        shell: bash
        run: cp LICENSE.txt THIRD_PARTY_NOTICES.md stage/

      - name: Package Linux runtime
        shell: bash
        run: |
          tar -czf "momoten-linux-${{ matrix.name }}.tar.gz" \
            -C stage/lib libmomoten.so momoten_icd.json \
            -C "$GITHUB_WORKSPACE/stage" LICENSE.txt THIRD_PARTY_NOTICES.md

      - uses: actions/upload-artifact@v7
        with:
          name: momoten-linux-${{ matrix.name }}
          path: momoten-linux-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: macos-15-intel}
          - {arch: arm64, runner: macos-15}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install test tools
        run: brew install glslang vulkan-loader

      - name: Configure native macOS build
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          xcodebuild -version
          test -f "$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenCL.framework/OpenCL.tbd"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DCMAKE_CXX_FLAGS=-Werror=unguarded-availability-new \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_INSTALL_NAME_DIR=@rpath \
            -DMOMOTEN_BUILD_DRIVER=ON \
            -DMOMOTEN_BUILD_TRANSLATOR=ON \
            -DMOMOTEN_BUILD_AMALGAMATION=ON \
            -DMOMOTEN_BUILD_TOOLS=OFF \
            -DMOMOTEN_BUILD_TESTS=ON \
            -DMOMOTEN_GLSLANG_VALIDATOR="$(command -v glslangValidator)" \
            -DMOMOTEN_TEST_OPENCL_LIBRARY="$(xcrun --show-sdk-path)/System/Library/Frameworks/OpenCL.framework/OpenCL.tbd" \
            -DMOMOTEN_INSTALL=ON

      - name: Build modular and amalgamated drivers and tests
        run: cmake --build build --parallel 3

      - name: Run generic tests (unavailable OpenCL devices are explicit skips)
        run: ctest --test-dir build --output-on-failure --timeout 180 --output-junit ctest.xml

      - name: Report test coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("build/ctest.xml")
          if report.exists():
              tests = ET.parse(report).getroot().findall("testcase")
              skipped = [test.attrib["name"] for test in tests if test.find("skipped") is not None]
              failed = [test.attrib["name"] for test in tests if test.find("failure") is not None]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"CTest: {len(tests)} total, {len(failed)} failed, {len(skipped)} skipped.\n\n")
                  for name in skipped:
                      summary.write(f"- Skipped (OpenCL runtime or optional feature unavailable): {name}\n")
          PY

      - name: Install stripped runtime
        run: cmake --install build --strip --prefix stage

      - name: Verify Mach-O architecture, deployment target and dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test -f stage/lib/libmomoten.dylib
          test ! -L stage/lib/libmomoten.dylib
          test -f stage/lib/momoten_icd.json
          test "$(find stage -type f | wc -l | tr -d ' ')" -eq 2
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess

          for library in (Path("stage/lib/libmomoten.dylib"), Path("build/libmomoten-amalgamated.dylib")):
              def output(*args):
                  return subprocess.check_output(args, text=True).strip()
              assert output("lipo", "-archs", str(library)) == os.environ["EXPECTED_ARCH"]
              identity = output("otool", "-D", str(library)).splitlines()[1].strip()
              assert identity == "@rpath/" + library.name, identity
              loads = output("otool", "-l", str(library))
              minimum = re.findall(r"^\s+(?:minos|version) (\d+\.\d+(?:\.\d+)?)$", loads, re.M)
              assert os.environ["MACOSX_DEPLOYMENT_TARGET"] in minimum, minimum
              assert "__DWARF" not in loads, "Unexpected debug sections"
              dependencies = output("otool", "-L", str(library)).splitlines()[2:]
              for dependency in dependencies:
                  name = dependency.strip().split(" (", 1)[0]
                  assert name.startswith(("/usr/lib/", "/System/Library/")), name
                  assert not any(word in name.lower() for word in ("opencl", "vulkan", "moltenvk")), name
              exports = output("nm", "-gU", str(library))
              for symbol in ("vkGetInstanceProcAddr", "vkCreateInstance", "vk_icdGetInstanceProcAddr",
                             "vk_icdGetPhysicalDeviceProcAddr", "vk_icdNegotiateLoaderICDInterfaceVersion"):
                  assert re.search(r"\b_" + symbol + r"$", exports, re.M), symbol
              print(library, identity, minimum, dependencies, "size:", library.stat().st_size)
          PY

      - name: Smoke test installed ICD and amalgamation with Apple OpenCL
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("stage/lib/momoten_icd.json").read_text())
          manifest["ICD"]["library_path"] = "./libmomoten-amalgamated.dylib"
          Path("build/momoten-amalgamated-icd.json").write_text(json.dumps(manifest))
          PY
          probe_args=()
          if [ "$(uname -m)" = arm64 ]; then
            clang tests/runtime/apple_opencl_probe.c -framework OpenCL -o "$RUNNER_TEMP/apple-opencl-probe"
            probe_args=(--apple-opencl-unavailable-probe "$RUNNER_TEMP/apple-opencl-probe")
          fi
          for variant in modular amalgamated; do
            if [ "$variant" = modular ]; then
              library=stage/lib/libmomoten.dylib
              manifest=stage/lib/momoten_icd.json
            else
              library=build/libmomoten-amalgamated.dylib
              manifest=build/momoten-amalgamated-icd.json
            fi
            set +e
            MOMOTEN_DEBUG=1 python3 tests/runtime/vulkan_loader_smoke.py "$library" "$manifest" \
              --loader "$(brew --prefix vulkan-loader)/lib/libvulkan.1.dylib" \
              --probe-opencl /System/Library/Frameworks/OpenCL.framework/OpenCL "${probe_args[@]}"
            result=$?
            set -e
            case "$result" in
              0) echo "- $variant: ICD ABI and system Vulkan Loader runtime passed" >> "$GITHUB_STEP_SUMMARY" ;;
              77) echo "::notice::$variant: ICD ABI passed; runtime skipped because no compatible Apple OpenCL device is exposed"
                  echo "- $variant: ICD ABI passed; OpenCL/Vulkan runtime SKIPPED (no compatible device)" >> "$GITHUB_STEP_SUMMARY" ;;
              78) echo "::notice::$variant: ICD ABI passed; Apple OpenCL runtime unavailable (native SDK also returns CL_INVALID_VALUE)"
                  echo "- $variant: ICD ABI passed; OpenCL/Vulkan runtime SKIPPED (Apple framework CL_INVALID_VALUE, independently reproduced with the SDK)" >> "$GITHUB_STEP_SUMMARY" ;;
              *) exit "$result" ;;
            esac
          done

      - name: Package macOS runtime
        run: |
          cp LICENSE.txt THIRD_PARTY_NOTICES.md stage/
          tar -czf "momoten-macos-${{ matrix.arch }}.tar.gz" \
            -C stage/lib libmomoten.dylib momoten_icd.json \
            -C "$GITHUB_WORKSPACE/stage" LICENSE.txt THIRD_PARTY_NOTICES.md
          mkdir relocated
          tar -xzf "momoten-macos-${{ matrix.arch }}.tar.gz" -C relocated
          python3 - <<'PY'
          import ctypes
          import json
          from pathlib import Path
          manifest = Path("relocated/momoten_icd.json").resolve()
          info = json.loads(manifest.read_text())
          library = manifest.parent / info["ICD"]["library_path"]
          assert library.name == "libmomoten.dylib"
          assert ctypes.CDLL(str(library)).vkGetInstanceProcAddr
          print("Packaged runtime loads after extraction:", library)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: momoten-macos-${{ matrix.arch }}
          path: momoten-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: windows-${{ matrix.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: x86_64, platform: x64, dumpbin_arch: x64}
          - {name: x86, platform: Win32, dumpbin_arch: x86}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A "${{ matrix.platform }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOMOTEN_BUILD_DRIVER=ON \
            -DMOMOTEN_BUILD_TRANSLATOR=ON \
            -DMOMOTEN_BUILD_TOOLS=OFF \
            -DMOMOTEN_BUILD_TESTS=OFF \
            -DMOMOTEN_INSTALL=ON

      - name: Build
        run: cmake --build build --config Release --target momoten_driver --parallel 4

      - name: Install
        run: cmake --install build --config Release --prefix stage

      - name: Verify Windows DLL exports
        shell: pwsh
        run: |
          if (!(Test-Path stage/bin/momoten.dll)) { throw 'Missing DLL' }
          if (!(Test-Path stage/bin/momoten_icd.json)) { throw 'Missing ICD JSON' }
          if (Test-Path stage/lib/momoten.lib) { throw 'Import library must not be installed' }
          if (Test-Path stage/include) { throw 'Headers must not be installed' }
          if (Test-Path stage/lib/cmake) { throw 'CMake package must not be installed' }
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $dumpbin = & $vswhere -latest -products '*' -find 'VC\\Tools\\MSVC\\**\bin\\Hostx64\\${{ matrix.dumpbin_arch }}\dumpbin.exe' | Select-Object -Last 1
          if (!$dumpbin) { throw 'MSVC dumpbin.exe was not found' }
          $exports = & $dumpbin /exports stage/bin/momoten.dll
          if ($LASTEXITCODE -ne 0 -or !($exports -match 'vkGetInstanceProcAddr')) {
            throw 'Missing Vulkan proc export'
          }

      - name: Bundle license notices
        shell: bash
        run: cp LICENSE.txt THIRD_PARTY_NOTICES.md stage/

      - uses: actions/upload-artifact@v7
        with:
          name: momoten-windows-${{ matrix.name }}
          path: stage/
          if-no-files-found: error

  android:
    name: android-${{ matrix.abi }}-api${{ matrix.api }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 4.0 (API 14): 32-bit ARM and x86 using NDK r17c.
          - {abi: armeabi-v7a, api: 14, legacy: true}
          - {abi: x86, api: 14, legacy: true}
          - {abi: arm64-v8a, api: 21, legacy: false}
          - {abi: x86_64, api: 21, legacy: false}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install legacy Android NDK r17c
        if: matrix.legacy
        shell: bash
        run: |
          # The bundled NDK r17c Clang requires libtinfo.so.5 on the host.
          sudo apt-get update
          sudo apt-get install -y libtinfo5
          curl --fail --location --retry 3 --output ndk-r17c.zip \
            https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q ndk-r17c.zip
          echo "MOMOTEN_NDK=$PWD/android-ndk-r17c" >> "$GITHUB_ENV"

      - name: Select modern Android NDK
        if: ${{ !matrix.legacy }}
        shell: bash
        run: |
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          echo "MOMOTEN_NDK=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

      - name: Backport SPIRV-Tools charconv for NDK r17c
        if: matrix.legacy
        shell: bash
        run: |
          # The pinned optimizer.cpp uses std::from_chars (C++17),
          # which the r17c libc++ does not yet provide.
          git -C third_party/spirv-tools apply --check ../../cmake/patches/spirv-tools-ndk-r17c.patch
          git -C third_party/spirv-tools apply ../../cmake/patches/spirv-tools-ndk-r17c.patch
          # r17c libc++ also lacks the C++17 std::optional deduction guide.
          # All 13 occurrences in this pinned file construct spv::Capability.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("third_party/spirv-tools/source/opt/trim_capabilities_pass.cpp")
          source = path.read_text()
          old = "std::optional(spv::Capability::"
          if source.count(old) != 13:
              raise SystemExit("Unexpected SPIRV-Tools optional construction count")
          path.write_text(source.replace(old, "std::optional<spv::Capability>(spv::Capability::"))
          PY

      - name: Remove NDK debug flags
        shell: bash
        run: |
          # NDK toolchains inject -g even for Release builds.
          # Match the approach used by ncnn's Android release workflow.
          for toolchain in \
            "$MOMOTEN_NDK/build/cmake/android.toolchain.cmake" \
            "$MOMOTEN_NDK/build/cmake/android-legacy.toolchain.cmake"; do
            if [ -f "$toolchain" ]; then
              sed -i -e '/^[[:space:]]*-g[[:space:]]*$/d' "$toolchain"
            fi
          done

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$MOMOTEN_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="android-${{ matrix.api }}" \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMOMOTEN_BUILD_DRIVER=ON \
            -DMOMOTEN_BUILD_TRANSLATOR=ON \
            -DMOMOTEN_BUILD_AMALGAMATION=ON \
            -DMOMOTEN_BUILD_TOOLS=OFF \
            -DMOMOTEN_BUILD_TESTS=OFF \
            -DMOMOTEN_INSTALL=ON

      - name: Verify Android compile flags
        shell: bash
        run: |
          # Fail if an NDK update moves -g to another toolchain location.
          python3 - <<'PY'
          import json
          import shlex
          from pathlib import Path

          commands = json.loads(Path("build/compile_commands.json").read_text())
          flagged = [item["file"] for item in commands
                     if "-g" in shlex.split(item["command"])]
          if flagged:
              raise SystemExit("Unexpected -g in Android compiler flags: " +
                               ", ".join(flagged[:5]))
          print(f"Verified {len(commands)} compile commands without -g")
          PY

      - name: Build
        run: cmake --build build --target momoten_driver momoten_amalgamated_driver --parallel 4

      - name: Install stripped release library
        run: cmake --install build --strip --prefix stage

      - name: Verify unversioned Android library
        shell: bash
        run: |
          test -f stage/lib/libmomoten.so
          test "$(find stage -type f | wc -l)" -eq 1
          readelf -Ws stage/lib/libmomoten.so | grep -E ' HMI$'
          readelf -Ws build/libmomoten-amalgamated.so | grep -E ' HMI$'
          case "${{ matrix.abi }}" in
            armeabi-v7a|x86) readelf -h stage/lib/libmomoten.so | grep -q 'Class:.*ELF32' ;;
            arm64-v8a|x86_64) readelf -h stage/lib/libmomoten.so | grep -q 'Class:.*ELF64' ;;
          esac
          test ! -L stage/lib/libmomoten.so
          test "$(find stage/lib -maxdepth 1 -name 'libmomoten.so*' | wc -l)" -eq 1
          readelf -d stage/lib/libmomoten.so > dynamic.txt
          if grep -q 'SONAME.*libmomoten.so\.' dynamic.txt; then
            echo 'Unexpected versioned SONAME' >&2
            exit 1
          fi
          if grep -Ei 'NEEDED.*(OpenCL|vulkan|c\+\+_shared)' dynamic.txt; then
            echo 'Unexpected runtime dependency' >&2
            exit 1
          fi
          readelf -Ws stage/lib/libmomoten.so | grep -E ' vkGetInstanceProcAddr$'
          if readelf -SW stage/lib/libmomoten.so | grep -E '\.debug_'; then
            echo 'Unexpected debug sections in Android release library' >&2
            exit 1
          fi
          stat -c 'libmomoten.so size: %s bytes' stage/lib/libmomoten.so

      - name: Bundle license notices
        shell: bash
        run: cp LICENSE.txt THIRD_PARTY_NOTICES.md stage/

      - uses: actions/upload-artifact@v7
        with:
          name: momoten-android-${{ matrix.abi }}-api${{ matrix.api }}
          path: stage/
          if-no-files-found: error

  package-release:
    name: package-release
    needs: [linux, macos, windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: momoten-*
          path: artifacts

      # Exercise release aggregation on PRs too, without publishing anything.
      - name: Assemble release archives and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import shutil
          import tarfile
          import zipfile

          targets = ["linux-x86_64", "linux-x86", "macos-x86_64", "macos-arm64",
                     "windows-x86_64", "windows-x86", "android-armeabi-v7a-api14",
                     "android-x86-api14", "android-arm64-v8a-api21", "android-x86_64-api21"]
          expected = {"momoten-" + target for target in targets}
          artifacts = Path("artifacts")
          # A rerun may also download the previous aggregate from this run.
          actual = {path.name for path in artifacts.iterdir()} - {"momoten-release"}
          assert actual == expected, "Incomplete artifact matrix"
          release = Path("release")
          release.mkdir()
          notices = {"LICENSE.txt", "THIRD_PARTY_NOTICES.md"}
          for name in sorted(expected):
              directory = artifacts / name
              files = {path.relative_to(directory).as_posix() for path in directory.rglob("*") if path.is_file()}
              if name.startswith(("momoten-linux-", "momoten-macos-")):
                  archive = name + ".tar.gz"
                  assert files == {archive}, (name, files)
                  runtime = "libmomoten.dylib" if "-macos-" in name else "libmomoten.so"
                  with tarfile.open(directory / archive) as bundle:
                      assert set(bundle.getnames()) == notices | {runtime, "momoten_icd.json"}
                      assert all(member.isfile() for member in bundle.getmembers())
                  shutil.copy2(directory / archive, release / archive)
              else:
                  runtime = {"bin/momoten.dll", "bin/momoten_icd.json"} if "-windows-" in name else {"lib/libmomoten.so"}
                  assert files == notices | runtime, (name, files)
                  with zipfile.ZipFile(release / (name + ".zip"), "w", zipfile.ZIP_DEFLATED) as bundle:
                      for filename in sorted(files):
                          bundle.write(directory / filename, filename)
          archives = sorted(release.iterdir())
          assert len(archives) == len(expected)
          (release / "SHA256SUMS").write_text("".join(
              hashlib.sha256(path.read_bytes()).hexdigest() + "  " + path.name + "\n"
              for path in archives))
          PY
          (cd release && sha256sum --check SHA256SUMS)

      - uses: actions/upload-artifact@v7
        with:
          name: momoten-release
          path: release/
          if-no-files-found: error
          overwrite: true

  release:
    name: publish-tagged-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: momoten-release
          path: release

      - name: Publish verified version-tag assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          gh release create "$RELEASE_TAG" release/* \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
